ktor {
    deployment {
        port = 20860
        port = ${?PORT}
    }
    application {
        modules = [ dev.tracedown.worker.ApplicationKt.module ]
    }
}

database {
    url = "jdbc:postgresql://localhost:5432/tracedown"
    url = ${?DATABASE_URL}
    user = "tracedown"
    user = ${?DATABASE_USER}
    password = ""
    password = ${?DATABASE_PASSWORD}
}

redis {
    a {
        url = "redis://localhost:6379"
        url = ${?REDIS_A_URL}
    }
    b {
        url = "redis://localhost:6380"
        url = ${?REDIS_B_URL}
    }
}

storage {
    s3 {
        # Uncomment to enable S3-compatible body storage deletion.
        # Works with any S3-compatible store (R2, MinIO, Backblaze B2, etc.)
        # endpoint = "https://account.r2.cloudflarestorage.com"
        endpoint = ${?STORAGE_S3_ENDPOINT}
        accessKey = ""
        accessKey = ${?STORAGE_S3_ACCESS_KEY}
        secretKey = ""
        secretKey = ${?STORAGE_S3_SECRET_KEY}
    }
}

worker {
    resultRetentionDays = 90
    resultRetentionDays = ${?RESULT_RETENTION_DAYS}
    hourlyAggregateRetentionDays = 365
    hourlyAggregateRetentionDays = ${?HOURLY_AGGREGATE_RETENTION_DAYS}
    agentHealthRetentionDays = 90
    agentHealthRetentionDays = ${?AGENT_HEALTH_RETENTION_DAYS}
    # Same variable the api-gateway reads — one setting governs the audit window.
    auditLogRetentionDays = 90
    auditLogRetentionDays = ${?AUDIT_LOG_RETENTION_DAYS}
    notificationLogRetentionDays = 90
    notificationLogRetentionDays = ${?NOTIFICATION_LOG_RETENTION_DAYS}
    trustedDomainMode = false
    trustedDomainMode = ${?TRUSTED_DOMAIN_MODE}

    intervals {
        hourlyAggregation = 900
        hourlyAggregation = ${?WORKER_INTERVAL_HOURLY_AGGREGATION}
        dailyAggregation = 3600
        dailyAggregation = ${?WORKER_INTERVAL_DAILY_AGGREGATION}
        retention = 3600
        retention = ${?WORKER_INTERVAL_RETENTION}
        purge = 300
        purge = ${?WORKER_INTERVAL_PURGE}
        sessionCleanup = 900
        sessionCleanup = ${?WORKER_INTERVAL_SESSION_CLEANUP}
    }
}
