# Session token signing
jwt {
    secret = "default-dev-secret-change-in-production"
    secret = ${?JWT_SECRET}

    ttlMinutes = 43200
    ttlMinutes = ${?JWT_TTL_MINUTES}
}

# Authentication and password rules
auth {
    passwordPolicy {
        # Controls the minimum password length, out of which
        # at least minUppercase, minDigits and minSpecial
        # must be corresponding characters.
        minLength = 8
        minLength = ${?PASSWORD_MIN_LENGTH}

        minUppercase = 1
        minUppercase = ${?PASSWORD_MIN_UPPERCASE}

        minDigits = 1
        minDigits = ${?PASSWORD_MIN_DIGITS}

        minSpecial = 1
        minSpecial = ${?PASSWORD_MIN_SPECIAL}
    }

    # TOTP issuer name shown in authenticator apps
    totpIssuer = "Tracedown"
    totpIssuer = ${?TOTP_ISSUER}
}

# Per-IP rate limiting (Redis B backed, sliding window)
rateLimit {
    enabled = true
    enabled = ${?RATE_LIMIT_ENABLED}

    # Number of trusted reverse proxies in front of the gateway. The client IP
    # used for rate-limit keys is taken this many hops back from the TCP peer,
    # so a client-supplied X-Forwarded-For cannot spoof the key. Set to the
    # actual count of proxies between the internet and the gateway (bundled
    # nginx = 1; add one per extra edge/CDN hop). 0 ignores XFF entirely.
    trustedProxies = 1
    trustedProxies = ${?RATE_LIMIT_TRUSTED_PROXIES}

    general {
        maxRequests = 120
        maxRequests = ${?RATE_LIMIT_GENERAL_MAX}

        windowSeconds = 60
        windowSeconds = ${?RATE_LIMIT_GENERAL_WINDOW}
    }
    auth {
        maxRequests = 15
        maxRequests = ${?RATE_LIMIT_AUTH_MAX}

        windowSeconds = 60
        windowSeconds = ${?RATE_LIMIT_AUTH_WINDOW}
    }
}
