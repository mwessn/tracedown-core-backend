# Email delivery
email {
    # smtp | resend | mailgun | console | file

    # 'console' supposed to be used in development -
    # prints the email content to the application console.
    # 'file' supposed to be used for unit tests -
    # saves the **latest email** to a .eml file.
    provider = "console"
    provider = ${?EMAIL_PROVIDER}

    fromAddress = "noreply@tracedown.dev"
    fromAddress = ${?EMAIL_FROM_ADDRESS}

    fromName = "Tracedown"
    fromName = ${?EMAIL_FROM_NAME}


    # Provider configs are only relevant when that provider is selected.

    # Console (dev): attachments are written here so they can be opened.
    # Must point at an ignored path — these are real generated documents.
    console {
        attachmentDir = "build/email-attachments"
        attachmentDir = ${?EMAIL_CONSOLE_ATTACHMENT_DIR}
    }

    # File
    file {
        path = "build/email-output.eml"
        path = ${?EMAIL_FILE_PATH}
    }

    # SMTP
    smtp {
        host = "localhost"
        host = ${?SMTP_HOST}

        port = 587
        port = ${?SMTP_PORT}

        username = ""
        username = ${?SMTP_USERNAME}

        password = ""
        password = ${?SMTP_PASSWORD}

        # STARTTLS | SMTPS | PLAIN
        tlsMode = "STARTTLS"
        tlsMode = ${?SMTP_TLS_MODE}
    }

    # Resend
    resend {
        apiKey = ""
        apiKey = ${?RESEND_API_KEY}
    }

    # Mailgun
    mailgun {
        apiKey = ""
        apiKey = ${?MAILGUN_API_KEY}

        domain = ""
        domain = ${?MAILGUN_DOMAIN}

        # us | eu
        region = "us"
        region = ${?MAILGUN_REGION}
    }
}
