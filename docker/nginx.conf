map $request_method $cors_method {
    OPTIONS 1;
    default 0;
}

# CORS origin allowlist. NEVER reflect an arbitrary Origin together with
# Access-Control-Allow-Credentials: true — that lets any website make
# credentialed cross-origin calls on a logged-in user's behalf. Instead, only
# echo the Origin back when it is on this allowlist; for anything else
# $cors_origin is empty and nginx omits the header entirely (the browser then
# blocks the cross-origin response).
#
# Edit the entries below for your deployment: each is scheme+host(+port), no
# trailing slash. The defaults cover local self-hosting only.
map $http_origin $cors_origin {
    default "";
    "~^https?://localhost(:[0-9]+)?$"   $http_origin;
    "~^https?://127\.0\.0\.1(:[0-9]+)?$" $http_origin;
}

# Credentials header is sent only when the origin was allowlisted above.
map $cors_origin $cors_credentials {
    default "";
    "~."    "true";
}

# Access log format for the WebSocket endpoint that strips the query string:
# the session token rides in ?token= on the legacy path and must not be logged.
log_format ws_no_query '$remote_addr - $remote_user [$time_local] '
                       '"$request_method $uri $server_protocol" '
                       '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

upstream gateway {
    server tracedown-gateway:20714;
}

upstream metrics {
    server tracedown-metrics:20850;
}

upstream realtime {
    server tracedown-realtime:20870;
}

server {
    listen 80;
    server_name _;

    # Use Docker DNS for upstream resolution
    resolver 127.0.0.11 valid=10s;

    # CORS headers (allowlisted origins only — see the maps above).
    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Credentials $cors_credentials always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
    add_header Access-Control-Max-Age 86400 always;
    # Responses vary by Origin, so caches must key on it.
    add_header Vary "Origin" always;

    # Security headers. The bearer token lives in the SPA's localStorage, so any
    # XSS is full session theft — keep these tight.
    #   - CSP: this host serves only JSON APIs, so nothing may be loaded/framed.
    #   - HSTS: force https (TLS is terminated at the edge/proxy in front).
    #   - X-Frame-Options / frame-ancestors: no framing (clickjacking).
    #   - nosniff: never MIME-sniff a response body.
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Preflight
    if ($cors_method) {
        return 204;
    }

    # API gateway
    location /api/ {
        proxy_pass http://gateway/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Prometheus metrics scrape endpoint
    location /metrics/ {
        proxy_pass http://metrics/metrics/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket (realtime-service)
    location /ws {
        # Strip the query string from access logs so a ?token= (legacy auth
        # fallback) never lands in them.
        access_log /var/log/nginx/access.log ws_no_query;

        # Variable forces per-request DNS resolution
        set $realtime_upstream http://tracedown-realtime:20870;
        proxy_pass $realtime_upstream/ws$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Health check
    location /ping {
        proxy_pass http://gateway/ping;
    }
}
