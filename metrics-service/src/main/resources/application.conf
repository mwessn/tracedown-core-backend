ktor {
    deployment {
        port = 20850
        port = ${?PORT}
    }
    application {
        modules = [ dev.tracedown.metrics.ApplicationKt.module ]
    }
}

database {
    url = "jdbc:postgresql://localhost:5432/tracedown"
    url = ${?DATABASE_URL}
    user = "tracedown"
    user = ${?DATABASE_USER}
    password = ""
    password = ${?DATABASE_PASSWORD}
}

redis {
    a {
        url = "redis://localhost:6379"
        url = ${?REDIS_A_URL}
    }
    b {
        url = "redis://localhost:6380"
        url = ${?REDIS_B_URL}
    }
}

metrics {
    metricsTtlSeconds = "86400"
    metricsTtlSeconds = ${?METRICS_TTL_SECONDS}

    hourlyBucketTtlSeconds = "90000"
    hourlyBucketTtlSeconds = ${?METRICS_HOURLY_BUCKET_TTL_SECONDS}
}
